# Reverse proxy minimal : nginx sert les fichiers statiques et envoie le PHP à WordPress (php-fpm)
server {
    listen 80 default_server;                 # répond sur le port 80, quel que soit le nom/IP demandé
    server_name www.my-wordpress.ch _;        # domaine du projet (+ "_" = n'importe quel autre nom/IP)
    root /var/www/html;                       # code WordPress (volume NFS partagé avec le service wordpress)
    index index.php;                          # page d'accueil = index.php de WordPress

    location / {
        try_files $uri $uri/ /index.php?$args;   # fichier existant sinon WordPress gère l'URL
    }

    location ~ \.php$ {
        include fastcgi_params;                                            # paramètres FastCGI standards
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # chemin du script PHP à exécuter
        fastcgi_pass wordpress:9000;   # nom du service Swarm -> VIP qui répartit la charge entre les répliques
    }
}
