services:
  db:
    image: mariadb:12.0.2
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - db_data:/var/lib/mysql
    networks: [backend]
    deploy:
      placement:
        constraints: [node.role == manager]

  wordpress:
    image: wordpress:6.8.2-fpm-alpine
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - wp_data:/var/www/html
    networks: [frontend, backend]
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
        max_replicas_per_node: 1

  nginx:
    image: nginx:1.28.0-alpine3.21
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - wp_data:/var/www/html:ro
    ports:
      - "80:80"
    networks: [frontend]
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1

  swarmpit:
    image: swarmpit/swarmpit:latest
    environment:
      SWARMPIT_DB: http://swarmpit-db:5984
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "888:8080"
    networks: [swarmpit]
    deploy:
      placement:
        constraints: [node.role == manager]

  swarmpit-db:
    image: treehouses/couchdb:2.3.1
    volumes:
      - swarmpit_db:/opt/couchdb/data
    networks: [swarmpit]
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true
  swarmpit:
    driver: overlay

volumes:
  db_data:
  swarmpit_db:
  wp_data:
    driver_opts:
      type: nfs
      o: "addr=192.168.122.10,rw,nfsvers=4"
      device: ":/srv/nfs/wordpress"

secrets:
  db_password:
    external: true
  db_root_password:
    external: true

configs:
  nginx_conf:
    file: ./nginx/default.conf
